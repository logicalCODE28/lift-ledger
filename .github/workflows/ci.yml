name: LiftLedger CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Test (Node 20)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Node.js 20 with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install clean dependencies
        run: npm ci

      - name: Run unit test suite (Vitest)
        run: npm test

      - name: Build production bundle (Vite)
        run: npm run build
